<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Black and white point comparison</title>
  <desc id="desc">A Traditional Chinese difference diagram showing black and white point levels hidden or included in the chart view.</desc>
  <rect width="1280" height="620" fill="#071016"/>
  <text x="64" y="64" fill="#f8fafc" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="30" font-weight="700">黑點 / 白點控制：後級 levels 與黑/白位 checkbox</text>
  <text x="64" y="98" fill="#b8c7d4" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="16">黑點與白點控制在 Advanced 分頁；曲線圖只有勾選「黑/白位」時才把後級 levels 畫進來。</text>
  <g font-family="Segoe UI, Noto Sans TC, Arial, sans-serif">
    <g transform="translate(64 138)">
      <rect width="548" height="414" rx="18" fill="#101923" stroke="#334155" stroke-width="2"/>
      <text x="28" y="42" fill="#e2e8f0" font-size="22" font-weight="700">黑/白位未勾選</text>
      <rect x="28" y="92" width="492" height="54" rx="10" fill="#0a1118" stroke="#263647"/>
      <text x="48" y="126" fill="#cbd5e1" font-size="15">黑點 12　白點 244　黑/白位 □</text>
      <rect x="48" y="184" width="452" height="172" fill="#081017" stroke="#253142"/>
      <path d="M48 356 L500 184" fill="none" stroke="#64748b" stroke-width="3"/>
      <path d="M48 356 C126 296 218 240 326 209 C402 188 456 178 500 174" fill="none" stroke="#22d3ee" stroke-width="5"/>
      <text x="48" y="384" fill="#cbd5e1" font-size="14">曲線只顯示核心 GSDF/CSDF table。</text>
    </g>
    <g transform="translate(668 138)">
      <rect width="548" height="414" rx="18" fill="#101923" stroke="#334155" stroke-width="2"/>
      <text x="28" y="42" fill="#e2e8f0" font-size="22" font-weight="700">黑/白位已勾選</text>
      <rect x="28" y="92" width="492" height="54" rx="10" fill="#0a1118" stroke="#263647"/>
      <text x="48" y="126" fill="#cbd5e1" font-size="15">黑點 12　白點 244　黑/白位 ☑</text>
      <rect x="48" y="184" width="452" height="172" fill="#081017" stroke="#253142"/>
      <path d="M48 356 L500 184" fill="none" stroke="#64748b" stroke-width="3"/>
      <path d="M48 356 L75 356 C132 304 224 238 326 203 C408 176 456 160 480 160 L500 160" fill="none" stroke="#22d3ee" stroke-width="5"/>
      <line x1="75" y1="184" x2="75" y2="356" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 6"/>
      <line x1="480" y1="184" x2="480" y2="356" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 6"/>
      <text x="48" y="384" fill="#cbd5e1" font-size="14">端點被 levels 裁切或拉伸；用來檢查是否過激。</text>
    </g>
  </g>
</svg>
