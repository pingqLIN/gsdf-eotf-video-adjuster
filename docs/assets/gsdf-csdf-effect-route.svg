<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">GSDF and CSDF route comparison</title>
  <desc id="desc">A Traditional Chinese difference diagram comparing GSDF route and CSDF route in the extension panel and reference output.</desc>
  <rect width="1280" height="620" fill="#071016"/>
  <text x="64" y="64" fill="#f8fafc" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="30" font-weight="700">公式切換 GSDF/CSDF：灰階路徑與色彩路徑並列</text>
  <text x="64" y="98" fill="#b8c7d4" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="16">同一個 Advanced route pill；左側偏亮度判讀，右側偏彩色影片與色彩參考圖樣。</text>
  <g font-family="Segoe UI, Noto Sans TC, Arial, sans-serif">
    <g transform="translate(64 138)">
      <rect width="548" height="414" rx="18" fill="#101923" stroke="#64748b" stroke-width="2"/>
      <text x="28" y="42" fill="#e2e8f0" font-size="22" font-weight="700">GSDF 灰階路徑</text>
      <rect x="28" y="92" width="492" height="54" rx="10" fill="#0a1118" stroke="#263647"/>
      <rect x="48" y="104" width="116" height="30" rx="8" fill="#e2e8f0"/>
      <text x="84" y="124" fill="#0f172a" font-size="14" font-weight="700">GSDF</text>
      <rect x="170" y="104" width="116" height="30" rx="8" fill="#111827" stroke="#334155"/>
      <text x="206" y="124" fill="#94a3b8" font-size="14" font-weight="700">CSDF</text>
      <rect x="48" y="184" width="452" height="172" fill="#081017" stroke="#253142"/>
      <path d="M48 356 L500 184" fill="none" stroke="#64748b" stroke-width="3"/>
      <path d="M48 356 C118 298 218 239 330 209 C408 188 462 180 500 176" fill="none" stroke="#22d3ee" stroke-width="5"/>
      <g transform="translate(66 216)">
        <rect width="120" height="86" fill="#111827" stroke="#64748b"/>
        <rect x="12" y="12" width="96" height="14" fill="#222"/><rect x="12" y="34" width="96" height="14" fill="#777"/><rect x="12" y="56" width="96" height="14" fill="#d1d5db"/>
      </g>
      <text x="48" y="384" fill="#cbd5e1" font-size="14">先看灰階、低彩度或亮度分配是否合理。</text>
    </g>
    <g transform="translate(668 138)">
      <rect width="548" height="414" rx="18" fill="#10212b" stroke="#22d3ee" stroke-width="2"/>
      <text x="28" y="42" fill="#e2e8f0" font-size="22" font-weight="700">CSDF 色彩路徑</text>
      <rect x="28" y="92" width="492" height="54" rx="10" fill="#0a1118" stroke="#263647"/>
      <rect x="48" y="104" width="116" height="30" rx="8" fill="#111827" stroke="#334155"/>
      <text x="84" y="124" fill="#94a3b8" font-size="14" font-weight="700">GSDF</text>
      <rect x="170" y="104" width="116" height="30" rx="8" fill="#22d3ee"/>
      <text x="206" y="124" fill="#06202b" font-size="14" font-weight="700">CSDF</text>
      <rect x="48" y="184" width="452" height="172" fill="#081017" stroke="#253142"/>
      <path d="M48 356 L500 184" fill="none" stroke="#64748b" stroke-width="3"/>
      <path d="M48 356 C126 286 220 224 328 188 C410 160 470 154 500 154" fill="none" stroke="#22d3ee" stroke-width="5"/>
      <g transform="translate(66 216)">
        <rect width="120" height="86" fill="#111827" stroke="#22d3ee"/>
        <rect x="12" y="12" width="96" height="14" fill="#ef4444"/><rect x="12" y="34" width="96" height="14" fill="#22c55e"/><rect x="12" y="56" width="96" height="14" fill="#38bdf8"/>
      </g>
      <text x="48" y="384" fill="#cbd5e1" font-size="14">再看彩色影片、CSDF 色彩圖與漸層是否斷階。</text>
    </g>
  </g>
</svg>
