<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">GSDF/CSDF chart anatomy</title>
  <desc id="desc">A Traditional Chinese annotated diagram of the GSDF/CSDF chart. It labels the toolbar, legend, black and white point checkbox, X axis, Y axis, Standard sRGB line, active remap line, and chart viewport.</desc>
  <rect width="1280" height="760" fill="#081016"/>
  <rect x="48" y="44" width="1184" height="672" rx="18" fill="#111821" stroke="#2f3e4d" stroke-width="2"/>

  <text x="84" y="94" fill="#f8fafc" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="32" font-weight="700">曲線圖區塊解剖</text>
  <text x="84" y="128" fill="#b6c6d3" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="17">這張示意圖標出文件第一次提到每個圖表元素時應交代的位置或樣式。</text>

  <g transform="translate(112 172)">
    <rect width="770" height="450" rx="12" fill="#0b1118" stroke="#334155"/>
    <rect x="24" y="22" width="722" height="46" rx="8" fill="#151f2a" stroke="#263647"/>
    <text x="44" y="52" fill="#9ee7ff" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="700">上方工具列</text>
    <circle cx="452" cy="45" r="7" fill="#22d3ee"/>
    <text x="466" y="51" fill="#e2e8f0" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="14">CSDF remap / GSDF remap</text>
    <circle cx="640" cy="45" r="7" fill="#64748b"/>
    <text x="654" y="51" fill="#e2e8f0" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="14">Standard sRGB</text>
    <rect x="596" y="78" width="150" height="34" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="612" y="100" fill="#cbd5e1" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="13">黑/白位 □</text>

    <rect x="72" y="122" width="628" height="270" fill="#0a0f15" stroke="#24313d"/>
    <g stroke="#1f2937" stroke-width="1">
      <line x1="72" y1="176" x2="700" y2="176"/>
      <line x1="72" y1="230" x2="700" y2="230"/>
      <line x1="72" y1="284" x2="700" y2="284"/>
      <line x1="72" y1="338" x2="700" y2="338"/>
      <line x1="198" y1="122" x2="198" y2="392"/>
      <line x1="324" y1="122" x2="324" y2="392"/>
      <line x1="450" y1="122" x2="450" y2="392"/>
      <line x1="576" y1="122" x2="576" y2="392"/>
    </g>
    <line x1="72" y1="392" x2="700" y2="392" stroke="#64748b" stroke-width="2"/>
    <line x1="72" y1="392" x2="72" y2="122" stroke="#64748b" stroke-width="2"/>
    <path d="M72 392 L198 338 L324 284 L450 230 L576 176 L700 122" fill="none" stroke="#64748b" stroke-width="4"/>
    <path d="M72 392 C150 315 216 258 324 220 C430 182 536 152 700 116" fill="none" stroke="#22d3ee" stroke-width="5"/>
    <text x="326" y="434" fill="#e2e8f0" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="15">X 軸：input pixel value（0..255）</text>
    <text x="-332" y="42" transform="rotate(-90)" fill="#e2e8f0" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="15">Y 軸：normalized output（0..1）</text>
  </g>

  <g font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="16">
    <line x1="910" y1="218" x2="850" y2="217" stroke="#9ee7ff" stroke-width="2"/>
    <text x="924" y="224" fill="#f8fafc">圖例：上方工具列右側的彩色圓點與文字</text>
    <text x="924" y="248" fill="#b6c6d3" font-size="14">用來分辨 active remap 線與 Standard sRGB 線。</text>

    <line x1="910" y1="280" x2="780" y2="267" stroke="#9ee7ff" stroke-width="2"/>
    <text x="924" y="286" fill="#f8fafc">黑/白位 checkbox</text>
    <text x="924" y="310" fill="#b6c6d3" font-size="14">位於工具列右側，勾選後把黑點/白點後級 levels 納入曲線。</text>

    <line x1="910" y1="370" x2="650" y2="325" stroke="#22d3ee" stroke-width="2"/>
    <text x="924" y="376" fill="#f8fafc">active remap 線</text>
    <text x="924" y="400" fill="#b6c6d3" font-size="14">青色粗線，取樣目前 GSDF 或 CSDF transfer table。</text>

    <line x1="910" y1="456" x2="652" y2="351" stroke="#94a3b8" stroke-width="2"/>
    <text x="924" y="462" fill="#f8fafc">Standard sRGB 基準線</text>
    <text x="924" y="486" fill="#b6c6d3" font-size="14">灰色斜線，作為一般輸入/輸出參考。</text>

    <line x1="910" y1="548" x2="506" y2="605" stroke="#9ee7ff" stroke-width="2"/>
    <text x="924" y="554" fill="#f8fafc">繪圖視窗</text>
    <text x="924" y="578" fill="#b6c6d3" font-size="14">深色矩形區；格線、軸線與兩條曲線都在這裡。</text>
  </g>
</svg>
