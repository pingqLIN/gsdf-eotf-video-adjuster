<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">GSDF pipeline RGB YCbCr comparison</title>
  <desc id="desc">A Traditional Chinese difference diagram comparing GSDF RGB channel processing and YCbCr style luma processing.</desc>
  <rect width="1280" height="620" fill="#071016"/>
  <text x="64" y="64" fill="#f8fafc" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="30" font-weight="700">GSDF pipeline：RGB channel 與 YCbCr-style luma 並列</text>
  <text x="64" y="98" fill="#b8c7d4" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="16">這個選項只在 GSDF route 下出現；兩者不是強弱差異，而是作用通道不同。</text>
  <g font-family="Segoe UI, Noto Sans TC, Arial, sans-serif">
    <g transform="translate(64 138)">
      <rect width="548" height="414" rx="18" fill="#101923" stroke="#334155" stroke-width="2"/>
      <text x="28" y="42" fill="#e2e8f0" font-size="22" font-weight="700">RGB pipeline</text>
      <rect x="42" y="106" width="464" height="78" rx="12" fill="#0a1118" stroke="#263647"/>
      <path d="M78 145 L176 145" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/><path d="M220 145 L318 145" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/><path d="M362 145 L460 145" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
      <text x="96" y="224" fill="#cbd5e1" font-size="15">R / G / B 各自套 table</text>
      <rect x="76" y="260" width="396" height="70" fill="#111827" stroke="#334155"/>
      <rect x="92" y="276" width="364" height="12" fill="#ef4444"/><rect x="92" y="296" width="364" height="12" fill="#22c55e"/><rect x="92" y="316" width="364" height="12" fill="#38bdf8"/>
      <text x="48" y="384" fill="#cbd5e1" font-size="14">適合檢查 channel remap 是否造成色彩相對位置改變。</text>
    </g>
    <g transform="translate(668 138)">
      <rect width="548" height="414" rx="18" fill="#101923" stroke="#334155" stroke-width="2"/>
      <text x="28" y="42" fill="#e2e8f0" font-size="22" font-weight="700">YCbCr-style pipeline</text>
      <rect x="42" y="106" width="464" height="78" rx="12" fill="#0a1118" stroke="#263647"/>
      <path d="M84 145 L456 145" stroke="#e5e7eb" stroke-width="10" stroke-linecap="round"/>
      <path d="M84 166 L456 166" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
      <text x="88" y="224" fill="#cbd5e1" font-size="15">分離 Y，再把 table 套到亮度方向</text>
      <rect x="76" y="260" width="396" height="70" fill="#111827" stroke="#334155"/>
      <rect x="92" y="276" width="364" height="32" fill="#6b7280"/>
      <path d="M92 316 C180 292 280 292 456 276" fill="none" stroke="#22d3ee" stroke-width="5"/>
      <text x="48" y="384" fill="#cbd5e1" font-size="14">適合灰階、低彩度與亮度主導內容。</text>
    </g>
  </g>
</svg>
