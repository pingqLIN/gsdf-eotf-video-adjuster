<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Dither Beta comparison</title>
  <desc id="desc">A Traditional Chinese difference diagram comparing Dither Beta off, noise, and color modes on a CMY RGB gradient.</desc>
  <defs>
    <linearGradient id="cmyrgb" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00ffff"/><stop offset="0.18" stop-color="#ff00ff"/><stop offset="0.36" stop-color="#ffff00"/><stop offset="0.55" stop-color="#ff0000"/><stop offset="0.74" stop-color="#00ff00"/><stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="620" fill="#071016"/>
  <text x="64" y="64" fill="#f8fafc" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="30" font-weight="700">Dither Beta：同一漸層的 off / noise / color 對照</text>
  <text x="64" y="98" fill="#b8c7d4" font-family="Segoe UI, Noto Sans TC, Arial, sans-serif" font-size="16">控制區只在參考側邊欄的「漸層」模式上方出現；用來檢查 banding，不是銳利化或校正證明。</text>
  <g font-family="Segoe UI, Noto Sans TC, Arial, sans-serif">
    <g transform="translate(64 140)">
      <rect width="1152" height="122" rx="18" fill="#101923" stroke="#334155" stroke-width="2"/>
      <text x="28" y="44" fill="#e2e8f0" font-size="22" font-weight="700">Off：先看原始 tone remap 後是否有 banding</text>
      <rect x="28" y="66" width="1096" height="30" fill="url(#cmyrgb)"/>
      <g fill="rgba(0,0,0,0.18)">
        <rect x="190" y="66" width="18" height="30"/><rect x="372" y="66" width="18" height="30"/><rect x="554" y="66" width="18" height="30"/><rect x="736" y="66" width="18" height="30"/><rect x="918" y="66" width="18" height="30"/>
      </g>
    </g>
    <g transform="translate(64 290)">
      <rect width="548" height="190" rx="18" fill="#101923" stroke="#334155" stroke-width="2"/>
      <text x="28" y="44" fill="#e2e8f0" font-size="22" font-weight="700">On + 使用 Noise</text>
      <rect x="28" y="70" width="492" height="46" fill="url(#cmyrgb)"/>
      <g fill="#ffffff" opacity="0.26">
        <circle cx="56" cy="88" r="1.5"/><circle cx="98" cy="103" r="1.2"/><circle cx="144" cy="82" r="1.4"/><circle cx="205" cy="104" r="1.5"/><circle cx="268" cy="89" r="1.2"/><circle cx="322" cy="106" r="1.4"/><circle cx="394" cy="82" r="1.5"/><circle cx="462" cy="104" r="1.2"/>
      </g>
      <text x="28" y="154" fill="#cbd5e1" font-size="14">打散亮度 banding；暗部可能變粗。</text>
    </g>
    <g transform="translate(668 290)">
      <rect width="548" height="190" rx="18" fill="#101923" stroke="#334155" stroke-width="2"/>
      <text x="28" y="44" fill="#e2e8f0" font-size="22" font-weight="700">On + 使用彩色</text>
      <rect x="28" y="70" width="492" height="46" fill="url(#cmyrgb)"/>
      <g opacity="0.38">
        <circle cx="64" cy="88" r="1.7" fill="#ef4444"/><circle cx="114" cy="104" r="1.4" fill="#22c55e"/><circle cx="165" cy="82" r="1.6" fill="#38bdf8"/><circle cx="230" cy="103" r="1.7" fill="#ef4444"/><circle cx="300" cy="87" r="1.4" fill="#22c55e"/><circle cx="366" cy="105" r="1.6" fill="#38bdf8"/><circle cx="438" cy="84" r="1.7" fill="#ef4444"/>
      </g>
      <text x="28" y="154" fill="#cbd5e1" font-size="14">打散彩色 banding；可能出現彩色細紋。</text>
    </g>
  </g>
</svg>
